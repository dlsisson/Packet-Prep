<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Packet Prep • Chapter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/lesson.css">

  <!-- Keep your existing script (theme, nav behavior, etc.) -->
  <script src="js/script.js" defer></script>

  <!-- Lesson loader: reads ?id=chapter-1, injects DOM, builds sidebar, prev/next, quiz -->
  <script src="js/lessonLoader.js" defer></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="topbar">
    <div class="logo-nav">
      <img src="Assets/Images/Logo/Logo.png" alt="Packet Prep Logo">
    </div>

    <nav class="nav" aria-label="Primary Navigation">
      <a href="packet_prep.html">Home</a>
      <a href="index.html#glossary">Glossary</a>
      <a href="index.html#about">About</a>
      <a href="index.html#progress">Progress</a>
      <a href="index.html#chapter-select">Chapter Select</a>
    </nav>

    <div id="themeSwitch"
         class="switch"
         role="switch"
         aria-checked="false"
         tabindex="0"
         title="Toggle dark mode">
    </div>

    <button class="icon-btn" id="menuBtn" type="button"
      aria-label="Open course menu"
      aria-controls="sidebar"
      aria-expanded="false">
      ☰
    </button>
  </header>

  <!-- Overlay for mobile sidebar drawer -->
  <div class="overlay" id="overlay" hidden></div>

  <!-- =========================
       PAGE LAYOUT
  ========================== -->
  <div class="page">
    <!-- =========================
         SIDEBAR / CURRICULUM NAV
    ========================== -->
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <!-- Header: chapter name + close button -->
      <div class="sidebar__header">
        <h3 class="sidebar__chapter" id="chapterLabel">Loading...</h3>
        <button class="icon-btn sidebar__close" id="sidebarCloseBtn" type="button" aria-label="Close sidebar" onclick="const page = document.querySelector('.page'); if(page) { page.classList.toggle('sidebar-closed'); }">×</button>
      </div>

      <!-- Progress section -->
      <div class="sidebar__progress-section">
        <div class="progressline">
          <div class="progressline__fill" id="courseProgressFill" style="width: 0%"></div>
        </div>
        <div class="sidebar__progress-text">
          <span class="muted">Progress</span>
          <span class="mono" id="courseProgressText">0%</span>
        </div>
      </div>

      <!-- Chapter list: JS will inject here -->
      <nav class="sidebar__nav" id="sidebarNav" aria-label="Chapters and sections"></nav>
    </aside>

    <!-- rail button to reopen sidebar when closed -->
    <button id="sidebarOpenBtn" class="sidebar-rail" aria-label="Open sidebar" onclick="document.querySelector('.page').classList.remove('sidebar-closed')">Chapters</button>

    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="content" id="main">
      <article class="lesson">
        <header class="lesson__header">
          <!-- ✅ JS injects title/subtitle -->
          <h1 class="lesson__title" id="chapterTitle">Loading...</h1>
          <p class="lesson__subtitle" id="chapterSubtitle"></p>

          <!-- Optional chips (you can fill later from JSON) -->
          <div class="lesson__chips" aria-label="Lesson metadata" id="chapterChips">
            <span class="chip">~10 min</span>
            <span class="chip">Beginner</span>
            <span class="chip chip--accent">Core</span>
          </div>
        </header>

        <!-- ✅ JS injects sections here -->
        <div id="lessonSections"></div>

        <!-- ✅ JS injects the quiz card here (single-card quiz) -->
        <div id="quizMount"></div>

        <!-- =========================
             PREV / NEXT (JS sets these)
        ========================== -->
        <footer class="pager" aria-label="Chapter navigation">
          <a class="pager__btn btn btn--ghost" id="prevBtn" href="#">
            ← Previous
          </a>

          <div class="pager__status">
            <span class="muted">Chapter</span>
            <span class="mono" id="chapterCount">—</span>
          </div>

          <a class="pager__btn btn btn--primary" id="nextBtn" href="#">
            Next →
          </a>
        </footer>
      </article>
    </main>
  </div>

</body>
</html>
