<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Packet Prep - Chapter</title>
    <link rel="icon" type="image/png" href="Assets/Images/Logo/favicon.png?v=7" />
    <link rel="apple-touch-icon" href="Assets/Images/Logo/favicon.png?v=7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/lesson.css" />

    <!-- Shared site behavior (theme, nav, etc.) -->
    <script src="js/script.js" defer></script>

    <!-- Lesson runtime: loads chapter content, sidebar, nav buttons, and quiz -->
    <script src="js/lessonLoader.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Site header -->
    <header class="topbar" id="top">
      <a class="logo-nav" href="packet_prep.html#home" aria-label="Packet Prep home">
        <img src="Assets/Images/Logo/nav-icon.png" alt="Packet Prep Logo" />
        <span class="logo-wordmark" aria-hidden="true">Packet Prep</span>
      </a>

      <nav class="nav" aria-label="Primary Navigation">
        <a href="packet_prep.html">Home</a>
        <a href="glossary.html">Glossary</a>
      </nav>

      <div class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-toggle__label" aria-hidden="true">Theme</span>
        <div
          id="themeSwitch"
          class="switch"
          role="switch"
          aria-checked="false"
          tabindex="0"
          title="Toggle dark mode"
        ></div>
      </div>

      <button
        class="icon-btn"
        id="menuBtn"
        type="button"
        aria-label="Open course menu"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        Menu
      </button>
    </header>

    <!-- Backdrop used when the mobile sidebar is open -->
    <div class="overlay" id="overlay" hidden></div>

    <!-- Main lesson layout -->
    <div class="page">
      <!-- Sidebar / chapter navigation -->
      <aside class="sidebar" id="sidebar" aria-label="Course navigation">
        <!-- Sidebar heading with a close button -->
        <div class="sidebar__header">
          <h3 class="sidebar__chapter" id="chapterLabel">Loading...</h3>
          <button class="icon-btn sidebar__close" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">
            Close
          </button>
        </div>

        <!-- Course progress summary -->
        <div class="sidebar__progress-section">
          <div class="progressline">
            <div class="progressline__fill" id="courseProgressFill" style="width: 0%"></div>
          </div>
          <div class="sidebar__progress-text">
            <span class="muted">Progress</span>
            <span class="mono" id="courseProgressText">0%</span>
          </div>
        </div>

        <!-- Chapter links are rendered by JS -->
        <nav class="sidebar__nav" id="sidebarNav" aria-label="Chapters and sections"></nav>
      </aside>

      <!-- Quick reopen button when the sidebar is closed -->
      <button
        id="sidebarOpenBtn"
        class="sidebar-rail"
        aria-label="Open sidebar"
        onclick="document.querySelector('.page').classList.remove('sidebar-closed')"
      >
        Chapters
      </button>

      <!-- Lesson content area -->
      <main class="content" id="main">
        <article class="lesson">
          <header class="lesson__header">
            <!-- Chapter title and subtitle are populated by JS -->
            <h1 class="lesson__title" id="chapterTitle">Loading...</h1>
            <p class="lesson__subtitle" id="chapterSubtitle"></p>

            <p class="lesson__time muted" id="chapterTimeEstimate">Estimated: 10-15 min</p>
          </header>

          <!-- Section content is rendered by JS -->
          <div id="lessonSections"></div>

          <!-- Quiz card mount point -->
          <div id="quizMount"></div>

          <!-- Previous/next chapter links are set by JS -->
          <footer class="pager" aria-label="Chapter navigation">
            <a class="pager__btn btn btn--ghost" id="prevBtn" href="#"> Previous </a>

            <div class="pager__status">
              <span class="muted">Chapter</span>
              <span class="mono" id="chapterCount">-</span>
            </div>

            <a class="pager__btn btn btn--primary" id="nextBtn" href="#"> Next </a>
          </footer>
        </article>
      </main>
    </div>

    <footer class="lesson-footer" aria-label="Page footer">
      <div class="lesson-footer__inner">
        <a class="lesson-footer__top" href="#top">Back to Top</a>
        <p class="lesson-footer__copy">&copy; 2026 Packet Prep</p>
      </div>
    </footer>
  </body>
</html>
